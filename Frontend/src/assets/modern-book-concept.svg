<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.1"/>
    </linearGradient>
    
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background Shape -->
  <path d="M0,300 Q200,250 400,300 T800,300 V600 H0 Z" fill="url(#bgGradient)"/>

  <!-- Floating Elements -->
  <g transform="translate(100,100)">
    <!-- Abstract Book Shape 1 -->
    <g transform="rotate(-15)">
      <rect x="0" y="0" width="120" height="160" rx="10" fill="#9333ea" opacity="0.9"/>
      <rect x="20" y="20" width="80" height="10" fill="white" opacity="0.6"/>
      <rect x="20" y="40" width="60" height="10" fill="white" opacity="0.6"/>
    </g>
    
    <!-- Decorative Circles -->
    <circle cx="180" cy="50" r="30" fill="#a855f7" opacity="0.2"/>
    <circle cx="200" cy="70" r="15" fill="#7c3aed" opacity="0.3"/>
  </g>

  <!-- Central Feature -->
  <g transform="translate(300,150)">
    <!-- Main Circle -->
    <circle cx="100" cy="100" r="80" fill="url(#highlightGradient)" opacity="0.8"/>
    
    <!-- Orbiting Elements -->
    <g transform="rotate(45, 100, 100)">
      <circle cx="200" cy="100" r="20" fill="#9333ea" opacity="0.6"/>
      <circle cx="0" cy="100" r="15" fill="#a855f7" opacity="0.6"/>
    </g>
    
    <!-- Book Icon -->
    <path d="M70,80 v40 h60 v-40 q-30,-10 -60,0" fill="white" opacity="0.9"/>
  </g>

  <!-- Right Side Elements -->
  <g transform="translate(550,200)">
    <!-- Stacked Rectangles -->
    <rect x="0" y="0" width="160" height="40" rx="5" fill="#9333ea" opacity="0.7"/>
    <rect x="20" y="50" width="160" height="40" rx="5" fill="#a855f7" opacity="0.7"/>
    <rect x="40" y="100" width="160" height="40" rx="5" fill="#7c3aed" opacity="0.7"/>
    
    <!-- Connecting Lines -->
    <path d="M0,20 C-50,20 -50,170 0,170" stroke="#9333ea" fill="none" stroke-width="2" opacity="0.3"/>
    <circle cx="-30" cy="95" r="5" fill="#9333ea" opacity="0.5"/>
  </g>

  <!-- Bottom Interactive Elements -->
  <g transform="translate(100,400)">
    <!-- Search Bar -->
    <rect x="0" y="0" width="300" height="50" rx="25" fill="white" opacity="0.9"/>
    <circle cx="270" cy="25" r="15" fill="#9333ea" opacity="0.8"/>
    
    <!-- Category Pills -->
    <g transform="translate(0,70)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#9333ea" opacity="0.8"/>
      <rect x="90" y="0" width="100" height="30" rx="15" fill="#a855f7" opacity="0.8"/>
      <rect x="200" y="0" width="90" height="30" rx="15" fill="#7c3aed" opacity="0.8"/>
    </g>
  </g>

  <!-- Floating Text Elements -->
  <g transform="translate(500,450)" opacity="0.8">
    <rect x="0" y="0" width="200" height="20" rx="10" fill="#9333ea"/>
    <rect x="20" y="30" width="160" height="20" rx="10" fill="#a855f7"/>
    <rect x="40" y="60" width="120" height="20" rx="10" fill="#7c3aed"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a189a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#3c037c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ana şekil -->
  <circle cx="150" cy="150" r="120" 
    fill="url(#logoGradient)" 
    filter="url(#shadow)"
  />

  <!-- İç katmanlar -->
  <path 
    d="M150 50 
       Q200 100, 150 150 
       Q100 200, 150 250" 
    fill="none" 
    stroke="rgba(255,255,255,0.3)" 
    stroke-width="10"
  />

  <!-- Kesişen çizgiler -->
  <line x1="80" y1="80" x2="220" y2="220" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="80" y1="220" x2="220" y2="80" stroke="white" stroke-width="4" opacity="0.5"/>
</svg>
